<!DOCTYPE html>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; direction: rtl; }

.shell { width: 100%; max-width: 540px; }

.header { text-align: center; margin-bottom: 2rem; }
.logo { font-size: 38px; margin-bottom: 8px; }
.title { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
.subtitle { font-size: 14px; color: #666; margin-top: 4px; }

.stats { display: flex; gap: 10px; margin-bottom: 1.25rem; }
.stat { flex: 1; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 14px; padding: 12px; text-align: center; }
.stat-val { font-size: 20px; font-weight: 700; color: #fff; }
.stat-lbl { font-size: 11px; color: #555; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

.prog-wrap { margin-bottom: 1.5rem; }
.prog-info { display: flex; justify-content: space-between; font-size: 12px; color: #555; margin-bottom: 6px; }
.prog-bar { height: 4px; background: #1a1a24; border-radius: 2px; }
.prog-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #7c3aed, #a78bfa); transition: width 0.4s cubic-bezier(.4,0,.2,1); }

.q-card { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 20px; padding: 1.75rem; margin-bottom: 1rem; }
.q-cat { font-size: 11px; color: #7c3aed; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
.q-text { font-size: 18px; font-weight: 600; color: #fff; line-height: 1.5; }

.opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
.opt { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 14px; padding: 14px 18px; font-size: 15px; color: #ccc; cursor: pointer; text-align: right; transition: all 0.18s; display: flex; align-items: center; gap: 12px; }
.opt:hover:not(:disabled) { border-color: #7c3aed; color: #fff; background: #201a30; }
.opt .letter { width: 28px; height: 28px; border-radius: 8px; background: #252530; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #666; flex-shrink: 0; margin-right: auto; }
.opt.correct { border-color: #10b981; background: #0d1f17; color: #6ee7b7; }
.opt.correct .letter { background: #10b981; color: #fff; }
.opt.wrong { border-color: #ef4444; background: #1f0d0d; color: #fca5a5; }
.opt.wrong .letter { background: #ef4444; color: #fff; }
.opt:disabled { cursor: default; }

.feedback { background: #1a1a24; border: 1px solid #2a2a38; border-radius: 14px; padding: 14px 18px; font-size: 14px; color: #aaa; min-height: 52px; display: flex; align-items: center; gap: 10px; }

.next-btn { width: 100%; margin-top: 1rem; padding: 15px; font-size: 16px; font-weight: 600; border-radius: 14px; border: none; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; cursor: pointer; transition: opacity 0.18s; }
.next-btn:hover { opacity: 0.88; }

.result { text-align: center; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 24px; padding: 2.5rem 2rem; }
.result-icon { font-size: 60px; margin-bottom: 1rem; }
.result-title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.result-sub { color: #666; font-size: 15px; margin-bottom: 0.5rem; }
.result-score { font-size: 48px; font-weight: 800; color: #a78bfa; margin: 1rem 0; }
.result-max { font-size: 14px; color: #555; margin-bottom: 2rem; }
.restart { padding: 14px 32px; border-radius: 14px; border: none; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.restart:hover { opacity: 0.88; }
</style>

<div class="shell">
  <div class="header">
    <div class="logo">🤪</div>
    <div class="title">Trivia الكوميدي</div>
    <div class="subtitle">أسئلة غريبة ومضحكة — تحدى نفسك!</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="qnum">1/8</div><div class="stat-lbl">سؤال</div></div>
    <div class="stat"><div class="stat-val" id="score">0</div><div class="stat-lbl">نقاط</div></div>
    <div class="stat"><div class="stat-val" id="streak">0 🔥</div><div class="stat-lbl">سلسلة</div></div>
  </div>

  <div class="prog-wrap">
    <div class="prog-info"><span>التقدم</span><span id="pct">12%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="prog" style="width:12%"></div></div>
  </div>

  <div class="q-card">
    <div class="q-cat" id="cat">سؤال عام</div>
    <div class="q-text" id="q"></div>
  </div>

  <div class="opts" id="opts"></div>
  <div class="feedback" id="fb"><span style="color:#444">اختار إجابتك 👆</span></div>
  <button class="next-btn" id="nxt" style="display:none" onclick="next()">السؤال الجاي ←</button>
</div>

<script>
const letters = ['أ','ب','ج','د'];
const qs = [
  { q: "إيه اللي بيسبح في المية بس مش بتبله؟", opts: ["السمكة الخجولة","الظل","القطة المجنونة","الموجة الخايفة"], ans: 1, fun: "💡 الظل بيبقى في المية بس مش بيتبلش!" },
  { q: "كم مرة الفيل بينسى يسرّح شعره في اليوم؟", opts: ["مرة","صفر مرات","٣ مرات","مش عارف عنده شعر؟"], ans: 3, fun: "🐘 الفيل أصلاً ملوش شعر! اكتشفت الحقيقة" },
  { q: "إيه أكتر حاجة بتعملها الأرنب وهو بيفكر في حياته؟", opts: ["بياكل جزر","بيعد نجوم","بيرمش بعينيه","بيكتب مذكراته"], ans: 2, fun: "🐰 الأرنب بيرمش تقريباً ٣٤٠ مرة في الدقيقة!" },
  { q: "إيه اللي بيطلع من البحر بس مش سمك ومش ناس؟", opts: ["موج","مايوه نسي حاجة","سمكة بتمشي","كابتن ماجد"], ans: 0, fun: "🌊 الموج طبعاً! بيطلع وبيرجع كمان" },
  { q: "لو الحمار راح كلية الطب، هيبقى إيه؟", opts: ["دكتور حمار","دكتور بيطري","فيلسوف","حمار بشهادة"], ans: 3, fun: "🎓 المهم الشهادة في الآخر!" },
  { q: "كام رجل عندها الدجاجة؟", opts: ["2","4","0","بيتعدوا بصعوبة"], ans: 0, fun: "🐔 اتنين بس! مش زي ما الناس بتعتقد" },
  { q: "إيه اللي بيغلط دايماً بس مش بييجي عليه لوم؟", opts: ["صديقك","التليفون","الساعة المكسورة","القط"], ans: 2, fun: "🕐 الساعة المكسورة صح مرتين في اليوم!" },
  { q: "الزيبرا أبيض وأسود ولا أسود وأبيض؟", opts: ["أبيض وأسود","أسود وأبيض","السؤال ده فلسفي جداً","الزيبرا مش مهتم"], ans: 2, fun: "🦓 العلم قال إن الزيبرا أساساً أسود! بس النقاش مستمر" }
];

let cur = 0, score = 0, streak = 0, answered = false;

function load() {
  const d = qs[cur];
  const pct = Math.round((cur + 1) / qs.length * 100);
  document.getElementById('qnum').textContent = (cur+1)+'/'+qs.length;
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak + ' 🔥';
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('q').textContent = d.q;
  document.getElementById('fb').innerHTML = '<span style="color:#444">اختار إجابتك 👆</span>';
  document.getElementById('nxt').style.display = 'none';
  answered = false;
  const c = document.getElementById('opts');
  c.innerHTML = '';
  d.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span>${o}</span><span class="letter">${letters[i]}</span>`;
    b.onclick = () => pick(i);
    c.appendChild(b);
  });
}

function pick(i) {
  if (answered) return;
  answered = true;
  const d = qs[cur];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  btns[d.ans].classList.add('correct');
  if (i === d.ans) {
    score += (10 + streak * 2); streak++;
    document.getElementById('fb').textContent = '✅ صح! ' + d.fun;
  } else {
    btns[i].classList.add('wrong'); streak = 0;
    document.getElementById('fb').textContent = '❌ غلط! ' + d.fun;
  }
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak + ' 🔥';
  document.getElementById('nxt').style.display = 'block';
}

function next() {
  cur++;
  if (cur >= qs.length) showResult();
  else load();
}

function showResult() {
  const emoji = score >= 80 ? '🏆' : score >= 50 ? '😄' : '😅';
  const msg = score >= 80 ? "عبقري كوميدي!" : score >= 50 ? "محترم! بس فيه أحسن" : "تمرّن أكتر يا بطل";
  document.querySelector('.shell').innerHTML = `
    <div class="result">
      <div class="result-icon">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-sub">نقاطك النهائية</div>
      <div class="result-score">${score}</div>
      <div class="result-max">من أصل ${qs.length * 12} نقطة تقريباً</div>
      <button class="restart" onclick="location.reload()">العب تاني ↺</button>
    </div>`;
}

load();
</script>
